version: 2

models:
  - name: int_customer_scd
    description: Builds type-2 style customer rows based on detected profile changes.
    columns:
      - name: customer_key
        tests: [not_null, unique]
      - name: customer_source_id
        tests: [not_null]
      - name: valid_from_date
        tests: [not_null]
      - name: valid_to_date
        tests: [not_null]
